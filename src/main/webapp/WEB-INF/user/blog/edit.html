<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa bài viết - Beta Community</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #f8fafc; }
        @keyframes gradientBG { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(24px); border-radius: 24px; padding: 42px 48px; width: 100%; max-width: 680px; }
        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 28px; }
        h1 span { background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], textarea { width: 100%; background: rgba(15,23,42,0.5); border: 1px solid rgba(255,255,255,0.15); color: #f8fafc; padding: 14px 16px; border-radius: 12px; font-size: 1rem; outline: none; transition: all 0.3s; font-family: 'Inter', sans-serif; resize: vertical; }
        input[type="text"]:focus, textarea:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,0.2); background: rgba(15,23,42,0.8); }
        input[type="text"]::placeholder, textarea::placeholder { color: rgba(148,163,184,0.5); }
        textarea { min-height: 200px; line-height: 1.7; }
        .char-count { font-size: 0.78rem; color: #64748b; text-align: right; margin-top: 4px; }
        .actions { display: flex; gap: 12px; margin-top: 28px; }
        .btn-submit { flex: 1; padding: 14px; background: #4F46E5; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #4338CA; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,70,229,0.5); }
        .btn-cancel { padding: 14px 24px; background: rgba(255,255,255,0.08); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; transition: 0.2s; }
        .btn-cancel:hover { background: rgba(255,255,255,0.12); color: #f8fafc; }
    </style>
</head>
<body>
<div class="card">
    <h1>✍️ Sửa <span>bài viết</span></h1>
    <form th:action="@{/blog/{id}/edit(id=${post.id})}" method="POST">
        <div class="form-group">
            <label for="title">Tiêu đề bài viết</label>
            <input type="text" id="title" name="title" th:value="${post.title}" placeholder="Nhập tiêu đề hấp dẫn..." required maxlength="200" oninput="updateCount(this, 'titleCount', 200)">
            <div class="char-count"><span id="titleCount" th:text="${#strings.length(post.title)}">0</span>/200</div>
        </div>
        <div class="form-group">
            <label for="content">Nội dung</label>
            <textarea id="content" name="content" placeholder="Chia sẻ suy nghĩ của bạn về bộ phim, diễn viên, hay điện ảnh nói chung..." required oninput="updateCount(this, 'contentCount', 5000)" maxlength="5000" th:text="${post.content}"></textarea>
            <div class="char-count"><span id="contentCount" th:text="${#strings.length(post.content)}">0</span>/5000</div>
        </div>
        <div class="actions">
            <a class="btn-cancel" th:href="@{/blog/{id}(id=${post.id})}">← Hủy</a>
            <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Lưu Thay Đổi</button>
        </div>
    </form>
</div>
<script>
    function updateCount(el, id, max) {
        document.getElementById(id).textContent = el.value.length;
    }
</script>
</body>
</html>
