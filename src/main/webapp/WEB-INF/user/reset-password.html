<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Cinemas | Đặt lại mật khẩu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0054a6;
            --primary-dark: #003d7a;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at top left, #0054a620 0%, transparent 50%),
                              radial-gradient(ellipse at bottom right, #0054a615 0%, transparent 50%);
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 45px;
            width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(16,185,129,0.35);
        }

        .brand h1 { font-size: 22px; font-weight: 800; color: #1e293b; }
        .brand p { font-size: 14px; color: #64748b; margin-top: 6px; }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .input-wrap i {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #1e293b;
            background: #f8fafc;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0,84,166,0.1);
        }

        /* Strength indicator */
        .strength-bar {
            height: 4px;
            border-radius: 4px;
            background: #e2e8f0;
            margin-top: 8px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s, background 0.3s;
        }

        .strength-label {
            font-size: 11px;
            margin-top: 4px;
            color: #94a3b8;
            min-height: 16px;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.3px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16,185,129,0.35);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
        }

        .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
        }

        .back-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover { text-decoration: underline; }

        /* Expired token state (no form) */
        .expired-state {
            text-align: center;
            padding: 10px 0;
        }

        .expired-state .icon { font-size: 48px; margin-bottom: 16px; }
        .expired-state h2 { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
        .expired-state p { font-size: 14px; color: #64748b; line-height: 1.6; }

        .btn-back {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 28px;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-back:hover { opacity: 0.85; }
    </style>
</head>
<body>
<div class="card">

    <!-- Token hợp lệ → Hiện form đặt lại -->
    <div th:if="${token != null}">
        <div class="brand">
            <div class="brand-icon">🔑</div>
            <h1>Đặt lại mật khẩu</h1>
            <p>Nhập mật khẩu mới cho tài khoản của bạn.</p>
        </div>

        <div class="alert alert-error" th:if="${error}">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/reset-password}" method="POST">
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPassword" name="newPassword" class="form-control"
                           placeholder="Ít nhất 8 ký tự" required minlength="8" maxlength="20"
                           oninput="checkStrength(this.value)">
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                           placeholder="Nhập lại mật khẩu mới" required minlength="8" maxlength="20">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-check-circle"></i> Đặt lại mật khẩu
            </button>
        </form>
    </div>

    <!-- Token hết hạn hoặc không hợp lệ → Hiện thông báo -->
    <div th:if="${token == null}" class="expired-state">
        <div class="icon">⏰</div>
        <h2>Liên kết không hợp lệ</h2>
        <p th:text="${error != null ? error : 'Liên kết đặt lại mật khẩu đã hết hạn hoặc không tồn tại.'}"></p>
        <a class="btn-back" th:href="@{/forgot-password}">Yêu cầu lại</a>
    </div>

    <p class="back-link" style="margin-top: 20px;">
        <a th:href="@{/login}"><i class="fas fa-arrow-left" style="font-size:12px;"></i> Quay lại đăng nhập</a>
    </p>
</div>

<script>
    function checkStrength(val) {
        const fill = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const configs = [
            { w: '25%', bg: '#ef4444', text: 'Rất yếu' },
            { w: '50%', bg: '#f59e0b', text: 'Yếu' },
            { w: '75%', bg: '#3b82f6', text: 'Trung bình' },
            { w: '100%', bg: '#10b981', text: 'Mạnh 💪' }
        ];

        if (val.length === 0) { fill.style.width = '0'; label.textContent = ''; return; }
        const c = configs[score - 1] || configs[0];
        fill.style.width = c.w;
        fill.style.background = c.bg;
        label.textContent = c.text;
        label.style.color = c.bg;
    }
</script>
</body>
</html>
