<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Change Password</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }

        .success {
            color: green;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div style="margin-bottom: 15px;">
            <a href="javascript:history.back()" style="text-decoration: none; font-weight: bold; color: #333;">&larr;
                Back</a>
        </div>

        <h2>Change Password</h2>

        <!-- SUCCESS MESSAGE -->
        <div th:if="${success}">
            <p class="success" th:text="${success}"></p>
            <p><a th:href="@{/login}">Click here to Login again</a></p>
        </div>

        <!-- ERROR MESSAGE -->
        <div th:if="${error}" class="error" th:text="${error}">
        </div>

        <form th:action="@{/change-password}" method="post">

            <label>Old Password</label>
            <input type="password" name="oldPassword" required />

            <label>New Password</label>
            <input type="password" name="newPassword" required />

            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" required />

            <button type="submit">Change Password</button>

        </form>

    </div>

</body>

</html>
