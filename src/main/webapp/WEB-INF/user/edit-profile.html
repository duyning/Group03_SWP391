<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Profile - Premium Experience</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-gradient-1: #0f172a;
            --bg-gradient-2: #1e1b4b;
            --bg-gradient-3: #312e81;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.2);
            --input-focus: #818cf8;
            --error-bg: rgba(239, 68, 68, 0.1);
            --error-text: #fca5a5;
            --success-bg: rgba(34, 197, 94, 0.1);
            --success-text: #86efac;
            --info-bg: rgba(56, 189, 248, 0.1);
            --info-text: #7dd3fc;
            --info-border: rgba(56, 189, 248, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow-x: hidden;
            padding: 40px 20px;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .edit-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            z-index: 10;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 48px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            position: relative;
        }

        .header {
            text-align: center;
        }

        .header h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
            line-height: 1.5;
        }

        /* Message Styles */
        .message {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .error-msg {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        /* Read-only Info */
        .readonly-info {
            background: var(--info-bg);
            border: 1px solid var(--info-border);
            color: var(--text-main);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .readonly-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .readonly-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .readonly-item span:first-child {
            font-size: 0.8rem;
            color: var(--info-text);
            font-weight: 600;
            text-transform: uppercase;
        }

        .readonly-item span:last-child {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .badge {
            display: inline-flex;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-left: 2px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        .form-group select option {
            background: var(--bg-gradient-2);
            color: var(--text-main);
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--input-focus);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }

        .error {
            font-size: 0.8rem;
            color: var(--error-text);
            margin-top: 4px;
            margin-left: 4px;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Decoration orbs */
        .orb-1,
        .orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.5;
            pointer-events: none;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            top: 50px;
            right: -100px;
            background: #818cf8;
            animation: float 8s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -150px;
            background: #c084fc;
            animation: float 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
            }

            100% {
                transform: translateY(-30px) scale(1.05);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 32px 24px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .readonly-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="edit-wrapper">
    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <div class="glass-card">
        <div class="header">
            <h2>Edit Profile</h2>
            <p>Update your personal information</p>
        </div>

        <!-- Messages container -->
        <div class="messages" th:if="${success != null or error != null}">
            <div class="message success" th:if="${success}">
                <svg style="width:20px;height:20px;flex-shrink:0" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span th:text="${success}"></span>
            </div>

            <div class="message error-msg" th:if="${error}">
                <svg style="width:20px;height:20px;flex-shrink:0" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span th:text="${error}"></span>
            </div>
        </div>

        <!-- READ-ONLY INFO -->
        <div class="readonly-info">
            <div class="readonly-grid">
                <div class="readonly-item">
                    <span>Account ID</span>
                    <span th:text="${'#' + account.accountID}"></span>
                </div>
                <div class="readonly-item">
                    <span>Role</span>
                    <div><span class="badge" th:text="${account.role}"></span></div>
                </div>
                <div class="readonly-item full-width">
                    <span>Email (cannot be changed)</span>
                    <span th:text="${account.email}"></span>
                </div>
                <div class="readonly-item full-width">
                    <span>Membership</span>
                    <div><span class="badge" th:text="${account.membershipLevel}"></span></div>
                </div>
            </div>
        </div>

        <form th:action="@{/edit-profile}" th:object="${account}" method="post"
              style="display: flex; flex-direction: column; gap: 20px;">

            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" th:field="*{name}" required />
                    <span class="error" th:errors="*{name}"></span>
                </div>

                <div class="form-group">
                    <label for="phoneNum">Phone Number *</label>
                    <input type="text" id="phoneNum" th:field="*{phoneNum}" required />
                    <span class="error" th:errors="*{phoneNum}"></span>
                </div>

                <div class="form-group">
                    <label for="age">Age *</label>
                    <input type="number" id="age" th:field="*{age}" required />
                    <span class="error" th:errors="*{age}"></span>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" th:field="*{gender}">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}" />
                </div>
            </div>

            <div class="actions">
                <a th:href="@{/profile}" class="btn btn-secondary">
                    <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>

</body>

</html>
