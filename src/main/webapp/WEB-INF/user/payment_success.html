<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh Toán Thành Công</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0fdf4; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .success-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .icon { font-size: 60px; color: #16a34a; margin-bottom: 20px; }
        h1 { color: #16a34a; font-size: 24px; margin: 0 0 10px; }
        p { color: #475569; font-size: 15px; margin: 0 0 25px; line-height: 1.5; }
        .btn-home { background: #16a34a; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; display: inline-block; transition: 0.2s; }
        .btn-home:hover { background: #15803d; }
    </style>
</head>
<body>
    <div class="success-box">
        <i class="fas fa-check-circle icon"></i>
        <h1>Thanh toán thành công!</h1>
        <p th:text="${message}">Cảm ơn bạn đã đặt vé. Vé của bạn đã được ghi nhận vào hệ thống.</p>
        <a th:href="@{/home}" class="btn-home">Quay lại trang chủ</a>
    </div>
</body>
</html>
