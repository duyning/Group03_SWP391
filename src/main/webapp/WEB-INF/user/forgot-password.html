<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Cinemas | Quên mật khẩu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0054a6;
            --primary-dark: #003d7a;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at top left, #0054a620 0%, transparent 50%),
                              radial-gradient(ellipse at bottom right, #0054a615 0%, transparent 50%);
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 45px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary), #0077cc);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,84,166,0.35);
        }

        .brand h1 { font-size: 22px; font-weight: 800; color: #1e293b; }
        .brand p { font-size: 14px; color: #64748b; margin-top: 6px; line-height: 1.5; }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .input-wrap i {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #1e293b;
            background: #f8fafc;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0,84,166,0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary), #0077cc);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.3px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,84,166,0.35);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
            text-decoration: none;
        }

        .back-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand">
        <div class="brand-icon">🎬</div>
        <h1>Quên mật khẩu?</h1>
        <p>Nhập email của bạn và chúng tôi sẽ gửi link đặt lại mật khẩu.</p>
    </div>

    <!-- Thông báo thành công -->
    <div class="alert alert-success" th:if="${success}">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}"></span>
    </div>

    <!-- Thông báo lỗi -->
    <div class="alert alert-error" th:if="${error}">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/forgot-password}" method="POST">
        <div class="form-group">
            <label for="email">Địa chỉ Email</label>
            <div class="input-wrap">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="example@email.com" required autofocus>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fas fa-paper-plane"></i> Gửi liên kết đặt lại
        </button>
    </form>

    <p class="back-link">
        Nhớ mật khẩu rồi? <a th:href="@{/login}">Đăng nhập ngay</a>
    </p>
</div>

</body>
</html>
