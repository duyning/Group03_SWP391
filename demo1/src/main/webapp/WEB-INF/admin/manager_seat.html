<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Beta Cinemas | Thiết kế sơ đồ ghế</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --vip: #dc2626;
            --sweet: #db2777;
            --empty: #e5e7eb;
            --bg: #f8fafc;
            --sidebar-bg: #1e293b;
            --sidebar-hover: #334155;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            display: flex;
            color: var(--text);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            height: 100vh;
            color: #f8fafc;
            position: fixed;
        }

        .sidebar-header {
            padding: 25px;
            font-size: 20px;
            font-weight: 800;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-nav {
            list-style: none;
            padding: 15px 0;
            margin: 0;
        }

        .sidebar-nav li {
            padding: 12px 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            transition: 0.2s;
        }

        .sidebar-nav li.active {
            background: var(--sidebar-hover);
            color: white;
            border-left: 4px solid var(--primary);
        }

        /* ===== MAIN ===== */
        .main {
            margin-left: 260px;
            flex: 1;
            padding: 30px 40px;
        }

        .header-content a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header-content h1 {
            margin-top: 12px;
            font-size: 26px;
            font-weight: 800;
        }

        /* ===== LAYOUT ===== */
        .design-container {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            align-items: start;
        }

        .control-panel,
        .visual-panel {
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .06);
            padding: 25px;
        }

        /* ===== CONTROL ===== */
        .control-panel h3 {
            margin: 0 0 20px;
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            display: block;
            margin-bottom: 6px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-size: 14px;
            transition: 0.2s;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: 0.25s;
        }

        .btn-create {
            background: #e5e7eb;
        }

        .btn-create:hover {
            background: #d1d5db;
        }

        .btn-save {
            background: var(--primary);
            color: white;
            margin-top: 12px;
        }

        .btn-save:hover {
            background: var(--primary-dark);
        }

        /* ===== VISUAL ===== */
        .visual-panel {
            text-align: center;
            overflow-x: auto;
            padding: 35px;
        }

        .screen {
            width: 75%;
            height: 10px;
            background: linear-gradient(to right, #cbd5e1, #94a3b8, #cbd5e1);
            margin: 0 auto 40px;
            border-radius: 50px;
            position: relative;
        }

        .screen::after {
            content: 'MÀN HÌNH';
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            letter-spacing: 1px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 25px;
            font-size: 13px;
            color: var(--muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .seat-grid {
            display: inline-grid;
            gap: 9px;
        }

        /* ===== SEAT ===== */
        .seat {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .seat:hover {
            transform: scale(1.08);
        }

        .seat.normal {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .seat.vip {
            background: var(--vip);
            color: white;
        }

        .seat.sweet {
            background: var(--sweet);
            color: white;
        }

        .seat.none {
            background: var(--empty);
            cursor: default;
            box-shadow: inset 0 0 0 1px #cbd5e1;
        }
    </style>

</head>

<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <img src="https://www.betacinemas.vn/Assets/Common/logo/logo.png" height="35" style="filter: brightness(0) invert(1);">
        <span>ADMIN</span>
    </div>
    <ul class="sidebar-nav">
        <a th:href="@{/admin/dashboard}" style="text-decoration: none;">
            <li><i class="fas fa-chart-line"></i> Dashboard</li>
        </a>

        <a th:href="@{/admin/manager_movie}" style="text-decoration: none;">
            <li><i class="fas fa-film"></i> Quản lý phim</li>
        </a>

        <a th:href="@{/admin/manager_schedule}" style="text-decoration: none;">
            <li><i class="fas fa-calendar-alt"></i> Lịch chiếu</li>
        </a>

        <a th:href="@{/admin/manager_cinema}" style="text-decoration: none;">
            <li class="active"><i class="fas fa-theater-masks"></i> Rạp & Phòng</li>
        </a>

        <li><i class="fas fa-tags"></i> Khuyến mãi</li>
        <li><i class="fas fa-cog"></i> Cài đặt hệ thống</li>
    </ul>
</aside>

<main class="main">
    <div class="header-content">
        <a th:href="@{/admin/room/manager(cinemaId=${room.cinema.id})}"
           style="text-decoration:none;color:var(--primary);font-weight:600;">
            <i class="fas fa-arrow-left"></i> Quay lại phòng chiếu
        </a>
        <h1>Thiết kế ghế: <span th:text="${room.roomName}">Phòng 01</span></h1>
    </div>

    <div class="design-container">
        <div class="control-panel">
            <h3>Cấu hình sơ đồ ghế</h3>

            <div class="input-group">
                <label>Số hàng (A–Z)</label>
                <input type="number" id="rows" value="8" min="1" max="26">
            </div>

            <div class="input-group">
                <label>Số cột</label>
                <input type="number" id="cols" value="10" min="1" max="20">
            </div>

            <button class="btn btn-create" onclick="generateGrid(true)">
                Tạo khung mới
            </button>

            <hr style="margin:25px 0;border:none;border-top:1px solid var(--border)">

            <div class="input-group">
                <label>Loại ghế</label>
                <select id="typeSelector">
                    <option value="normal">Ghế Thường</option>
                    <option value="vip">Ghế VIP</option>
                    <option value="sweet">Ghế Đôi</option>
                    <option value="none">Trống (Lối đi)</option>
                </select>
            </div>

            <button class="btn btn-save" onclick="saveSeats()">
                Lưu sơ đồ ghế
            </button>
        </div>

        <div class="visual-panel">
            <div class="legend">
                <div class="legend-item">
                    <div class="seat normal" style="width:20px;height:20px"></div> Thường
                </div>
                <div class="legend-item">
                    <div class="seat vip" style="width:20px;height:20px"></div> VIP
                </div>
                <div class="legend-item">
                    <div class="seat sweet" style="width:20px;height:20px"></div> Đôi
                </div>
                <div class="legend-item">
                    <div class="seat none" style="width:20px;height:20px"></div> Trống
                </div>
            </div>

            <div class="screen"></div>
            <div id="seatGrid" class="seat-grid"></div>
        </div>
    </div>
</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    const existingSeatsRaw = [[${ existingSeats }]];

    const existingSeats = (typeof existingSeatsRaw === 'string')
        ? JSON.parse(existingSeatsRaw)
        : (existingSeatsRaw || []);
    /*]]>*/

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let initializedFromDB = false;

    function generateGrid(forceNew = false) {
        const grid = document.getElementById('seatGrid');
        grid.innerHTML = '';
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let rows, cols;

        // ✅ KIỂM TRA DỮ LIỆU DB
        if (existingSeats.length > 0 && !forceNew) {
            let maxRow = 0, maxCol = 0;
            existingSeats.forEach(s => {
                maxRow = Math.max(maxRow, alphabet.indexOf(s.rowName));
                maxCol = Math.max(maxCol, s.seatColumn);
            });
            rows = maxRow + 1;
            cols = maxCol;
            document.getElementById('rows').value = rows;
            document.getElementById('cols').value = cols;
        } else {
            rows = +document.getElementById('rows').value;
            cols = +document.getElementById('cols').value;
        }

        grid.style.gridTemplateColumns = `repeat(${cols}, 35px)`;

        for (let i = 0; i < rows; i++) {
            for (let j = 1; j <= cols; j++) {
                const seat = document.createElement('div');
                const rowLabel = alphabet[i];
                seat.dataset.row = rowLabel;
                seat.dataset.col = j;

                // TÌM GHẾ TRONG DB
                const found = existingSeats.find(s => s.rowName === rowLabel && s.seatColumn === j);

                if (found) {
                    // Đổ đúng loại ghế từ DB
                    let typeClass = 'normal';
                    if (found.seatType === 'Ghế VIP') typeClass = 'vip';
                    else if (found.seatType === 'Ghế Đôi') typeClass = 'sweet';

                    seat.className = `seat ${typeClass}`;
                    seat.innerText = found.seatNumber;
                } else {
                    // Nếu load từ DB mà ô này không có ghế -> để trống (lối đi)
                    if (existingSeats.length > 0 && !forceNew) {
                        seat.className = 'seat none';
                        seat.innerText = '';
                    } else {
                        seat.className = 'seat normal';
                        seat.innerText = rowLabel + j;
                    }
                }

                // ✅ QUAN TRỌNG: Thêm lại sự kiện click để Admin có thể sửa
                seat.onclick = function () {
                    const type = document.getElementById('typeSelector').value;
                    this.className = `seat ${type}`;
                    if (type === 'none') {
                        this.innerText = '';
                    } else {
                        this.innerText = this.dataset.row + this.dataset.col;
                    }
                };

                grid.appendChild(seat);
            }
        }
    }

    function saveSeats() {
        const roomId = new URLSearchParams(location.search).get('roomId');
        if (!roomId) return alert("Thiếu roomId");

        const seatList = [];

        document.querySelectorAll('.seat:not(.none)').forEach(s => {
            seatList.push({
                rowName: s.dataset.row,
                seatColumn: +s.dataset.col,
                seatNumber: s.dataset.row + s.dataset.col,
                seatType: s.classList.contains('vip') ? 'Ghế VIP' :
                    s.classList.contains('sweet') ? 'Ghế Đôi' : 'Ghế Thường',
                status: 'Hoạt động'
            });
        });

        // 1. Hiện thông báo đang xử lý (Loading)
        Swal.fire({
            title: 'Đang lưu sơ đồ...',
            text: 'Vui lòng chờ trong giây lát',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });

        // 2. Gửi yêu cầu tới SeatController
        fetch('save-layout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ roomId: +roomId, seatList })
        })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    // 3. Thông báo thành công
                    Swal.fire({
                        icon: 'success',
                        title: 'Thành công!',
                        text: d.message,
                        confirmButtonColor: '#2563eb',
                        timer: 2000,
                        timerProgressBar: true
                    }).then(() => {
                        // Quay lại trang quản lý phòng sau khi lưu
                        location.href = document.querySelector('.header-content a').href;
                    });
                } else {
                    // 4. Thông báo lỗi từ nghiệp vụ
                    Swal.fire({
                        icon: 'error',
                        title: 'Thất bại',
                        text: d.message,
                        confirmButtonColor: '#dc2626'
                    });
                }
            })
            .catch(() => {
                // 5. Thông báo lỗi kết nối
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi hệ thống',
                    text: 'Không thể kết nối tới máy chủ. Vui lòng thử lại!',
                    confirmButtonColor: '#dc2626'
                });
            });
    }

    generateGrid();
</script>

</body>

</html>
